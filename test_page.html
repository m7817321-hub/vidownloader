<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Media Grabber 테스트 페이지</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 { color: #2563eb; margin-bottom: 8px; }
    p { color: #64748b; line-height: 1.6; }
    .section { margin-top: 30px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 15px;
    }
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }
    .bg-banner {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      background-image: url('https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=1200&auto=format&fit=crop&q=80');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      margin-top: 15px;
    }
    video {
      width: 100%;
      max-height: 350px;
      border-radius: 8px;
      margin-top: 15px;
      background: black;
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">테스트 환경</span>
    <h1>Media Grabber 테스트 페이지</h1>
    <p>
      이 페이지에는 다양한 형태의 고화질 이미지(Unsplash), CSS 배경 이미지, 그리고 HTML5 샘플 비디오가 포함되어 있습니다.<br>
      브라우저 우측 상단의 <strong>Media Grabber 확장 프로그램 아이콘</strong>을 클릭하여 미디어가 올바르게 감지되는지 확인해 보세요!
    </p>

    <!-- Images Section -->
    <div class="section">
      <h2>1. 일반 이미지 태그 (IMG Elements)</h2>
      <div class="gallery">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&auto=format&fit=crop&q=80" alt="자연 풍경" />
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80" alt="바다 풍경" />
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&auto=format&fit=crop&q=80" alt="기술 회로" />
      </div>
    </div>

    <!-- Background Image Section -->
    <div class="section">
      <h2>2. CSS 배경 이미지 (Background Image)</h2>
      <div class="bg-banner">
        CSS 배경 이미지 (자동 감지 대상)
      </div>
    </div>

    <!-- Video Section -->
    <div class="section">
      <h2>3. HTML5 동영상 (Video Element)</h2>
      <video controls poster="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&auto=format&fit=crop&q=80">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        브라우저가 동영상을 지원하지 않습니다.
      </video>
    </div>
  </div>
</body>
</html>
