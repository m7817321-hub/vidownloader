<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Grabber</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <img src="icons/icon48.png" alt="Logo" class="logo" />
        <div>
          <h1 class="title">Media Grabber</h1>
          <p class="subtitle" id="domainText">미디어 감지 중...</p>
        </div>
      </div>
      <button id="refreshBtn" class="icon-btn" title="새로고침">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </header>

    <!-- Navigation / Filter Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-type="all">
        전체 <span class="badge" id="countAll">0</span>
      </button>
      <button class="tab-btn" data-type="image">
        이미지 <span class="badge" id="countImage">0</span>
      </button>
      <button class="tab-btn" data-type="video">
        동영상 <span class="badge" id="countVideo">0</span>
      </button>
    </nav>

    <!-- Toolbar -->
    <div class="toolbar">
      <label class="checkbox-label">
        <input type="checkbox" id="selectAllCheckbox" />
        <span>전체 선택</span>
      </label>

      <div class="toolbar-actions">
        <select id="sizeFilter" class="select-filter">
          <option value="0">모든 크기</option>
          <option value="200">> 200px (중간 이상)</option>
          <option value="500">> 500px (고화질)</option>
          <option value="1000">> 1000px (초고화질)</option>
        </select>
        <button id="downloadSelectedBtn" class="btn btn-primary" disabled>
          선택 다운로드 (<span id="selectedCount">0</span>)
        </button>
      </div>
    </div>

    <!-- Media Grid List -->
    <main class="content-area">
      <div id="loadingView" class="status-box">
        <div class="spinner"></div>
        <p>페이지의 미디어를 스캔하고 있습니다...</p>
      </div>

      <div id="emptyView" class="status-box hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12h8"></path>
        </svg>
        <p>감지된 이미지나 동영상이 없습니다.</p>
      </div>

      <div id="mediaGrid" class="media-grid hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span id="statusInfo">준비 완료</span>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
